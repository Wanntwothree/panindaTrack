</head>
<body>
    <div class="container">
        <nav class="nav-bar">

    <main class="content">
        <h1>Sales</h1>

        <div class="content-container" id="sales">
            <h3>Products</h3>

            <div id="sales-display"></div>
            <p id="sales-message"></p>

            <p class="sales-total">Total: <span id="total">₱0.00</span></p>
            <button type="button" id="checkoutBtn">Checkout</button>
        </div>
    </main>

    </div>

    <dialog id="checkout-dialog">
        <h3>Confirm checkout</h3>
        <div id="checkout-summary"></div>
        <p>Total: <span id="checkout-total"></span></p>
        <div class="dialog-buttons">
            <button type="button" id="confirmBtn">Confirm</button>
            <button type="button" id="backBtn">Back</button>
        </div>
    </dialog>

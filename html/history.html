<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>History</title>
</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <a href="../index.html"><h1 class="text-logo">PanindaTrack</h1></a>
            <ul>
                <li><a href="../index.html">Summary</a></li>
                <li><a href="sales.html">Sales</a></li>
                <li><a href="inventory.html">Inventory</a></li>
                <li><a href="history.html">History</a></li>
                <li>
                    <li>
                        <button type="button" id="themeBtn" aria-label="Toggle light and dark mode">🌙</button>
                    </li>
                </li>
            </ul>
        </nav>

        <main class="content">
            <h1>History</h1>

            <div class="tabs">
                <button type="button" class="tab-btn active" data-tab="stock">Stock logs</button>
                <button type="button" class="tab-btn" data-tab="checkout">Checkouts</button>
            </div>

            <section id="stock-section">
                <div class="toolbar">
                    <label for="from-input">From</label>
                    <input type="date" id="from-input">
                    <label for="to-input">To</label>
                    <input type="date" id="to-input">
                    <select id="type-input">
                        <option value="all">All</option>
                        <option value="in">Stock In</option>
                        <option value="out">Stock Out</option>
                    </select>
                    <button type="button" id="clearBtn">Show all</button>
                </div>

                <p id="history-message"></p>

            <div class="stat-cards">
                <div class="stat-card">
                    <span>Current total stock</span>
                    <strong id="total-stock">0</strong>
                </div>
                <div class="stat-card in">
                    <span>Total stock in</span>
                    <strong id="total-in">0</strong>
                </div>
                <div class="stat-card out">
                    <span>Total stock out</span>
                    <strong id="total-out">0</strong>
                </div>
            </div>

            <div id="history-display" class="scroll-box"></div>
        </section>

        <section id="checkout-section" hidden>
            <div class="toolbar">
                <label for="co-from">From</label>
                <input type="date" id="co-from">
                <label for="co-to">To</label>
                <input type="date" id="co-to">
                <button type="button" id="co-clear">Show all</button>
            </div>

            <p id="co-message"></p>

            <div class="co-cards">
                <div class="co-card">
                    <span>Total sales</span>
                    <strong id="co-total">₱0.00</strong>
                </div>
                <div class="co-card units-card">
                    <span>Total units sold</span>
                    <div id="co-top"></div>
                </div>
            </div>
            <div class="co-list" id="co-display"></div>
        </section>

        <dialog id="receipt-dialog">
            <div id="rc-head"></div>
            <div id="rc-items"></div>
            <div id="rc-total"></div>
            <div class="dialog-buttons">
                <button type="button" id="rc-close">Close</button>
            </div>
        </dialog>
        </main>

    </div>

    <script src="../js/script.js"></script>
    <script src="../js/history.js"></script>
</body>
</html>

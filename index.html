<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Summary</title>
</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <a href="index.html"><h1 class="text-logo">PanindaTrack</h1></a>
            <ul>
                <li><a href="index.html">Summary</a></li>
                <li><a href="html/sales.html">Sales</a></li>
                <li><a href="html/inventory.html">Inventory</a></li>
                <li><a href="html/history.html">History</a></li>
                <li><a href="html/settings.html">Settings</a></li>
            </ul>
        </nav>
    
        <main class="content">
            <h1>Summary</h1>

            <p id="today-date"></p>

            <div class="stat-cards">
                <div class="stat-card sales">
                    <span>Total sales</span>
                    <strong id="total-all">₱0.00</strong>
                    <small id="checkout-count">0 checkouts</small>
                </div>

                <div class="stat-card">
                    <span>Current total stock</span>
                    <strong id="total-stock">0</strong>
                </div>

                <div class="stat-card in">
                    <span>Total stock in</span>
                    <strong id="total-in">0</strong>
                </div>

                <div class="stat-card out">
                    <span>Total stock out</span>
                    <strong id="total-out">0</strong>
                </div>
            </div>

            <div class="summary-grid">
                <div class="content-container top-card">
                    <h3>Top units sold</h3>
                    <div id="top-display"></div>
                </div>

                <div class="content-container status-card">
                    <h3>Stock Status</h3>
                    <div class="status-header">
                        <button type="button" class="status-btn active" data-status="all">All</button>
                        <button type="button" class="status-btn" data-status="high">High</button>
                        <button type="button" class="status-btn" data-status="moderate">Moderate</button>
                        <button type="button" class="status-btn" data-status="low">Low</button>
                    </div>
                    <div id="status-display"></div>
                </div>
            </div>
            
        </main>

    </div>
    <script src="js/script.js"></script>
    <script src="js/summary.js"></script>
</body>
</html>
